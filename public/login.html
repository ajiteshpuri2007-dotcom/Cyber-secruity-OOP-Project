<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRiVY – Account Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="brand-container">
      <a href="index.html" style="display:flex; align-items:center; gap:0.75rem; text-decoration:none;">
        <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <div>
          <div class="brand-title">PR<span>i</span>VY</div>
          <span class="brand-subtitle">URL Threat Intelligence</span>
        </div>
      </a>
    </div>
    <div class="auth-nav-group">
      <a href="signup.html" class="btn btn-secondary btn-sm">Create Account</a>
      <a href="index.html" class="nav-link">Home</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <svg class="auth-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h2 class="auth-title">Welcome to PRiVY</h2>
        <p class="auth-subtitle">Sign in to access your security telemetry and scan history</p>
      </div>

      <!-- Alert Banners -->
      <div id="login-alert" class="alert alert-danger hidden"></div>
      <div id="login-success" class="alert alert-success hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username or email" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">
          <span id="btn-text">Authenticate & Sign In</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Don't have an account? <a href="signup.html">Register here</a>
      </div>

      <!-- Default Admin Hint -->
      <div style="margin-top: 1.5rem; padding: 0.85rem; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-muted);">
        <strong style="color: var(--brand-light);">Initial Admin Credentials:</strong><br />
        Username: <code style="color: var(--text-main);">admin</code> &bull; Password: <code style="color: var(--text-main);">Admin@12345</code>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 PRiVY Security Systems. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const successBox = document.getElementById('login-success');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      successBox.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btnText.textContent = 'Verifying...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = resp.headers.get('content-type') || '';
        let data;
        if (contentType.includes('application/json')) {
          data = await resp.json();
        } else {
          const text = await resp.text();
          throw new Error(text || 'Authentication endpoint returned non-JSON error');
        }

        if (!resp.ok) {
          throw new Error(data.error || 'Authentication failed. Please check credentials.');
        }

        // Store tokens securely
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('user', JSON.stringify(data.user || { username, role: data.role }));

        successBox.textContent = 'Authentication verified. Redirecting to workspace...';
        successBox.classList.remove('hidden');

        setTimeout(() => {
          if (data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 600);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('hidden');
      } finally {
        btnText.textContent = 'Authenticate & Sign In';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
